[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mongodb-hackathon-placeholder"
version = "0.1.0"
description = "Fixture-driven payment approval pipeline with MongoDB transaction fences"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pymongo>=4.10,<5",
  "anthropic>=0.40,<1",
  "elevenlabs>=1,<3",
  "raindrop-ai>=0.0.20,<1",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools]
py-modules = ["config", "interfaces", "live_adapters", "observability", "oracle", "pipeline", "rules", "worker"]
packages = ["db", "fixtures", "scripts"]

[tool.setuptools.package-data]
fixtures = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a real local MongoDB replica set"]
