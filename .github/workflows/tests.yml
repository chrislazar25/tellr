name: Backend tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Start MongoDB replica set
        run: docker compose up -d --wait --wait-timeout 90
      - name: Test backend and transaction races
        run: uv run --frozen pytest -q
      - name: Run offline CLI demo
        run: |
          uv run --frozen python -m db.seed
          uv run --frozen python pipeline.py demo --confirm-from verbatim
      - name: MongoDB diagnostics on failure
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop MongoDB
        if: always()
        run: docker compose down
