services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./scripts/init-replica.js:/scripts/init-replica.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--file", "/scripts/init-replica.js"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  mongo-data:
